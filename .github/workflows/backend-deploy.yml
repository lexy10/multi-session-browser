name: Deploy backend

# Builds the backend image, pushes it to GHCR, and deploys it to the droplet.
# Runs on pushes to main that touch backend/, or manually.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mpb-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE }}:latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # DROPLET_HOST / DROPLET_USER / DROPLET_SSH_KEY live in the "main"
    # GitHub Environment, so this job must opt into it to read them.
    environment: main
    steps:
      - uses: actions/checkout@v4

      # Ship the compose file + Caddyfile to the droplet's home folder, so the
      # droplet never needs the repo — only Docker and a ~/.env you create once.
      - name: Copy compose + Caddyfile to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "backend/docker-compose.prod.yml,backend/Caddyfile"
          target: "~"
          strip_components: 1   # drop the "backend/" prefix -> ~/docker-compose.prod.yml

      - name: Pull image + (re)start
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            export BACKEND_IMAGE=${{ env.IMAGE }}:latest
            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
