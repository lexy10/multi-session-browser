name: Build installers

# Produces the macOS .dmg and the Windows .exe (NSIS) installer on native runners.
# Trigger manually (Actions tab → Run workflow) or by pushing a version tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: browser/package-lock.json

      - run: npm ci

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installers
          path: |
            browser/dist/*.dmg
            browser/dist/*.exe
          if-no-files-found: warn
